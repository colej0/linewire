name: Enforce HTTPS
on:
  workflow_dispatch:
permissions:
  pages: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
      - name: Enable HTTPS enforcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"https_enforced":true}')
          echo "HTTP $code"
          cat /tmp/pages-put.json || true
          test "$code" = "204" -o "$code" = "200"
      - name: Verify HTTPS enforced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | tee /tmp/pages-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pages-after.json'))
          print('https_enforced=', d.get('https_enforced'))
          print('cname=', d.get('cname'))
          assert d.get('https_enforced') is True, d
          PY
